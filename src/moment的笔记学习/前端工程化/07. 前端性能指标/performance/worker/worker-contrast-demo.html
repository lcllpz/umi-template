<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Worker 示例：主线程 vs Worker</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 560px;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.6;
      }
      button {
        margin: 0.25rem 0.5rem 0.25rem 0;
        padding: 0.5rem 1rem;
        cursor: pointer;
      }
      #tick {
        font-weight: bold;
        color: #0a7;
      }
      #result {
        margin-top: 1rem;
        padding: 0.75rem;
        background: #f5f5f5;
        border-radius: 6px;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>Web Worker 小例子</h1>
    <p>
      下面数字每 100ms 加 1。若在<strong>主线程</strong>做重计算，数字会<strong>停住</strong>；若在
      <strong>Worker</strong>里算，数字会<strong>继续走</strong>。
    </p>
    <p>计时器读数：<span id="tick">0</span></p>
    <p>
      <button type="button" id="btnWorker">在 Worker 里累加（不卡界面）</button>
      <button type="button" id="btnMain">在主线程累加（会卡住计时器）</button>
    </p>
    <div id="result">点击按钮开始…</div>
    <script src="worker-contrast-demo.js"></script>
  </body>
</html>
